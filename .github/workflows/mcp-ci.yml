name: MCP security and contract checks

on:
  pull_request:
    paths:
      - "services/mcp/**"
      - "app/oauth/**"
      - "app/api/oauth/**"
      - "app/auth/mfa/**"
      - "app/auth/login/**"
      - "app/auth/callback/**"
      - "app/sistema/mcp/**"
      - "app/api/mcp/**"
      - "app/api/tasks/notification-emails/**"
      - "components/sistema/mcp/**"
      - "lib/mcp/**"
      - "lib/supabase/middleware.ts"
      - "middleware.ts"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/verify-mcp-boundaries.mjs"
      - "scripts/verify-mcp-sql-syntax.mjs"
      - "docs/mcp/**"
      - "vercel.json"
      - "MCP_BUSINESS_CONTROL_PLAN.md"
      - "MCP_IMPLEMENTATION_PROMPT.md"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "next.config.*"
      - ".github/workflows/mcp-ci.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "services/mcp/**"
      - "app/oauth/**"
      - "app/api/oauth/**"
      - "app/auth/mfa/**"
      - "app/auth/login/**"
      - "app/auth/callback/**"
      - "app/sistema/mcp/**"
      - "app/api/mcp/**"
      - "app/api/tasks/notification-emails/**"
      - "components/sistema/mcp/**"
      - "lib/mcp/**"
      - "lib/supabase/middleware.ts"
      - "middleware.ts"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/verify-mcp-boundaries.mjs"
      - "scripts/verify-mcp-sql-syntax.mjs"
      - "docs/mcp/**"
      - "vercel.json"
      - "MCP_BUSINESS_CONTROL_PLAN.md"
      - "MCP_IMPLEMENTATION_PROMPT.md"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "next.config.*"
      - ".github/workflows/mcp-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install MCP dependencies
        run: npm ci --ignore-scripts
        working-directory: services/mcp

      - name: Verify MCP security boundaries
        run: npm run mcp:verify

      - name: Parse MCP SQL and PL/pgSQL
        run: npm run mcp:sql:verify

      - name: Typecheck the web approval flow
        run: npm run typecheck

      - name: Lint MCP web and verification code
        run: >
          npx eslint
          app/api/mcp
          app/api/oauth
          app/api/tasks/notification-emails
          app/auth/callback
          app/auth/login
          app/auth/mfa
          app/oauth
          app/sistema/mcp
          components/sistema/mcp
          lib/mcp
          lib/supabase/middleware.ts
          middleware.ts
          scripts/verify-mcp-boundaries.mjs
          scripts/verify-mcp-sql-syntax.mjs
          --max-warnings=0

      - name: Test the web approval contracts
        run: npm run mcp:web:test

      - name: Build the web application
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Typecheck MCP service
        run: npm run typecheck
        working-directory: services/mcp

      - name: Test MCP service
        run: npm run test
        working-directory: services/mcp

      - name: Build MCP service
        run: npm run compile
        working-directory: services/mcp

      - name: Audit MCP production dependencies
        run: npm audit --omit=dev --audit-level=moderate
        working-directory: services/mcp
