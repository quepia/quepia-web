name: Social worker (Zernio)

# Disparador frecuente del procesamiento social. El plan Hobby de Vercel solo
# admite crons diarios; este workflow llama al endpoint interno autenticado.
# Requiere los secretos SOCIAL_PROCESS_URL (https://<dominio>/api/internal/social/process)
# y CRON_SECRET. Si faltan, el job termina sin hacer nada.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: social-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Invocar procesamiento
        env:
          SOCIAL_PROCESS_URL: ${{ secrets.SOCIAL_PROCESS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SOCIAL_PROCESS_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secretos no configurados; no se ejecuta."
            exit 0
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 70 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$SOCIAL_PROCESS_URL")
          echo "HTTP $status"
          head -c 2000 response.json; echo
          test "$status" = "200"
